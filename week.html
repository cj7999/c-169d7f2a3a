<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study week</title>
<style>
:root{--bg:#fff;--card:#f7f7f5;--edge:#e9e9e7;--ink:#37352f;--mut:#8f8e8a;--faint:#ededeb;--acc:#37352f}
@media all{:root{--bg:#191919;--card:#202020;--edge:#2d2d2d;--ink:#ececea;--mut:#8c8c8a;--faint:#2a2a2a;--acc:#f5f5f4}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);height:100%;overflow:hidden}
body{color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#s{position:absolute;left:0;top:0;width:1000px;padding:12px 14px;transform-origin:0 0;visibility:hidden}
.lbl{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.card{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:14px 16px;min-width:0}
button{font:inherit;color:var(--ink);background:var(--faint);border:0;border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px;font-weight:500}
button:hover{background:var(--edge)}button:disabled{opacity:.35;cursor:default}
svg{display:block}svg text{fill:var(--mut);font-size:10px}#tl text,#heat text{font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.sync{color:var(--mut);font-size:11px}
.empty{color:var(--mut);font-size:13px;padding:16px 0;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:9px 11px;min-width:0}
.kpi span{display:block;color:var(--mut);font-size:11px}
.kpi b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.kpi em{display:block;font-style:normal;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .bd,.ph .two,.ph .recs{grid-template-columns:1fr!important}.ph .kpis{grid-template-columns:repeat(3,1fr)!important}.ph .wk{gap:3px!important}.ph .wk div{padding:5px!important}.ph .phx{display:none!important}.ph #s{padding:8px 10px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:7px;opacity:0;white-space:pre;z-index:9}
.two{display:grid;grid-template-columns:1fr 300px;gap:12px;margin-top:12px}
.h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.h b{font-size:15px;font-weight:600}.h small{color:var(--mut);font-size:12px}
.tb{display:grid;grid-template-columns:10px 1fr 46px 46px 50px;gap:0 8px;align-items:center}
.tb>*{padding:8px 0;border-bottom:1px solid var(--edge);font-size:13.5px;white-space:nowrap}
.tb .th{color:var(--mut);font-size:11px;padding-top:0}.tb .r{text-align:right}.tb .z{color:var(--mut)}
</style></head><body>
<div id="s"><div class="kpis" id="kpis"></div>
<div class="two"><div class="card"><div class="h"><span class="lbl">This week</span><small id="ws"></small></div><div id="bars"></div></div>
<div class="card phx"><div class="h"><span class="lbl">By subject</span><small>today · week · month</small></div><div class="tb" id="tb"></div></div></div></div><div id="tip"></div>
<script>
var D,S,B,A,AD={},T,TS,FIRST,N0=new Date(),TD=new Date(N0.getFullYear(),N0.getMonth(),N0.getDate());
var SUB=[["Specialist","#3b82f6"],["Methods","#06b6d4"],["Chemistry","#22c55e"],["Physics","#94a3b8"],["English","#6366f1"],["Unsorted","#78716c"]];
var WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],WL=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],ML=["January","February","March","April","May","June","July","August","September","October","November","December"];
function $(i){return document.getElementById(i)}
function p2(n){return(n<10?"0":"")+n}
function k(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function add(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function mon(d){return add(d,-((d.getDay()+6)%7))}
function wi(d){return(d.getDay()+6)%7}
function dd(d){return WD[wi(d)]+" "+d.getDate()+" "+MN[d.getMonth()]}
function day(d){return D[k(d)]||[0,0,0,0,0,0]}
function tot(d){var a=day(d),t=0;for(var i=0;i<6;i++)t+=a[i]||0;return t}
function sumR(a,b){var t=0;for(var d=a;d<=b;d=add(d,1))t+=tot(d);return t}
function subR(a,b){var s=[0,0,0,0,0,0];for(var d=a;d<=b;d=add(d,1)){var x=day(d);for(var i=0;i<6;i++)s[i]+=x[i]||0}return s}
function fm(m){m=Math.round(m);var h=Math.floor(m/60),r=m%60;return h?h+"h "+p2(r)+"m":r+"m"}
function hc(m){m=Math.round(m);return Math.floor(m/60)+":"+p2(m%60)}
function fh(m){return(Math.round(m/6)/10)+"h"}
function hm(m){m=Math.round(m)%1440;var h=Math.floor(m/60);return((h%12)||12)+":"+p2(m%60)+(h<12?" am":" pm")}
function last(){return(TS==k(TD)||D[k(TD)])?TD:add(TD,-1)}
function fit(){var s=$("s"),W=innerWidth,H=innerHeight,MW=660,i,w,h,z;s.style.transform="none";var PW=400;document.body.classList.toggle("ph",W<560);if(W<560){s.style.width=PW+"px";h=s.offsetHeight;z=Math.max(Math.min(W/PW,H/h),Math.min(W/PW,.8));var ps=h*z>H;document.documentElement.style.overflowY=document.body.style.overflowY=ps?"auto":"hidden";document.body.style.minHeight=ps?(h*z+8)+"px":"";s.style.transform="scale("+z+")";s.style.left=Math.max(0,(W-PW*z)/2)+"px";s.style.top="0";s.style.visibility="visible";return}
z=1;for(i=0;i<5;i++){w=Math.max(MW,W/z);s.style.width=w+"px";h=s.offsetHeight;z=Math.min(1.25,H/h,W/w)}w=Math.max(MW,W/z);s.style.width=w+"px";h=s.offsetHeight;z=Math.min(1.25,H/h,W/w);
var sc=0;if(z<.86){z=Math.min(.86,W/MW);w=Math.max(MW,W/z);s.style.width=w+"px";h=s.offsetHeight;sc=h*z>H}document.documentElement.style.overflowY=document.body.style.overflowY=sc?"auto":"hidden";document.body.style.minHeight=sc?(h*z+8)+"px":"";
s.style.transform="scale("+z+")";s.style.left=Math.max(0,(W-w*z)/2)+"px";s.style.top=sc?"0":Math.max(0,(H-h*z)/2)+"px";s.style.visibility="visible"}
function redraw(){draw();fit()}
var tip;function show(e){var t=e.target.getAttribute&&e.target.getAttribute("data-t");if(!t){tip.style.opacity=0;return}tip.textContent=t;tip.style.opacity=1;var x=e.clientX+12,y=e.clientY+12,r=tip.getBoundingClientRect();if(x+r.width>innerWidth-6)x=e.clientX-r.width-12;if(y+r.height>innerHeight-6)y=e.clientY-r.height-12;tip.style.left=x+"px";tip.style.top=y+"px"}
document.addEventListener("mousemove",show);document.addEventListener("mouseleave",function(){tip.style.opacity=0});addEventListener("resize",fit);
document.addEventListener("DOMContentLoaded",function(){tip=$("tip");D=window.D||{};S=window.S||{};B=window.B||{};A=window.A||{};T=window.T||"";TS=window.TS||"";Object.keys(A).forEach(function(id){var x=A[id];if(!x||!x[0])return;var sh=x[1].split(" · ")[0].replace(/^(Specialist|Methods|Mathematical Methods|Chemistry|Physics|English)\s*/,"")||x[1];(AD[x[0]]=AD[x[0]]||[]).push({t:x[1],s:x[2],sh:sh})});var ks=Object.keys(D).sort();FIRST=ks.length?new Date(ks[0]+"T00:00"):TD;if($("sync"))$("sync").textContent=T?"Synced from YPT · "+T:"Waiting for first sync";redraw()});
function chart(items,W,H,o){o=o||{};var mx=0;items.forEach(function(it){var t=0;for(var i=0;i<6;i++)t+=it.v[i]||0;it.t=t;if(t>mx)mx=t});if(!mx)return'<div class="empty" style="height:'+H+'px;padding-top:'+(H/2-10)+'px">No study yet</div>';
var hs=[1,2,3,4,5,6,8,10,12,15,20,25,30,40,50,60,80,100,150,200],stp=60;for(var q=0;q<hs.length;q++){stp=hs[q]*60;if(mx/stp<=4)break}var top=Math.ceil(mx/stp)*stp,L=30,Bt=18,Tp=16,ih=H-Bt-Tp,n=items.length,bw=(W-L)/n,h="";
for(var y=0;y<=top;y+=stp){var yy=Tp+ih-y/top*ih;h+='<line x1="'+L+'" x2="'+W+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--edge)"/><text x="0" y="'+(yy+3)+'">'+(y/60)+'h</text>'}
items.forEach(function(it,j){var x=L+j*bw+bw*.22,w=Math.max(2,bw*.56),yb=Tp+ih,tp=it.l+"\n"+fm(it.t);for(var i=0;i<6;i++){var v=it.v[i]||0;if(!v)continue;var hh=v/top*ih;yb-=hh;h+='<rect x="'+x+'" y="'+yb+'" width="'+w+'" height="'+hh+'" fill="'+SUB[i][1]+'"/>';tp+="\n"+SUB[i][0]+"  "+fm(v)}
if(o.lab&&it.t)h+='<text x="'+(x+w/2)+'" y="'+(yb-4)+'" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:600">'+hc(it.t)+'</text>';
h+='<rect x="'+(L+j*bw)+'" y="0" width="'+bw+'" height="'+(H-Bt)+'" fill="transparent" data-t="'+tp+'"/>';if(it.x)h+='<text x="'+(L+j*bw+bw/2)+'" y="'+(H-4)+'" text-anchor="middle"'+(it.b?' style="fill:var(--ink);font-weight:600"':'')+'>'+it.x+'</text>'});
if(o.avg){var a=0,c=0;items.forEach(function(it){if(!it.f){a+=it.t;c++}});a/=c||1;var ya=Tp+ih-a/top*ih;h+='<line x1="'+L+'" x2="'+W+'" y1="'+ya+'" y2="'+ya+'" stroke="var(--acc)" stroke-dasharray="4 3" opacity=".6"/><text x="'+(W-2)+'" y="'+(ya-4)+'" text-anchor="end" style="fill:var(--ink)">avg '+fm(a)+'</text>'}
return'<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+h+'</svg>'}
function streak(){var n=0,d=TD;if(!tot(d))d=add(d,-1);while(d>=FIRST&&tot(d)>0){n++;d=add(d,-1)}return n}
function kpi(l,v,s){return'<div class="kpi"><span>'+l+'</span><b>'+v+'</b><em>'+(s||"&nbsp;")+'</em></div>'}
function draw(){var hd=last(),w=mon(TD),ms=new Date(TD.getFullYear(),TD.getMonth(),1),n=Math.min(28,Math.round((TD-FIRST)/864e5)+1),wk=sumR(w,TD),lw=sumR(add(w,-7),add(TD,-7)),st=streak();
$("kpis").innerHTML=kpi(+hd==+TD?"Today":"Yesterday",fm(tot(hd)),dd(hd))+kpi("This week",fm(wk),(wk>=lw?"▲ ":"▼ ")+fm(Math.abs(wk-lw))+" vs last week")+kpi("This month",fm(sumR(ms,TD)),ML[TD.getMonth()])+kpi("Daily average",fm(sumR(add(TD,-n+1),TD)/n),"last "+n+" days")+kpi("Streak",st+(st==1?" day":" days"),"in a row")+kpi("All time",fh(sumR(FIRST,TD)),"since "+dd(FIRST));
var it=[],el=0;for(var i=0;i<7;i++){var d=add(w,i),f=d>TD;if(!f)el++;it.push({l:dd(d),v:f?[0,0,0,0,0,0]:day(d),f:f,b:+d==+TD,x:WD[i]+" "+d.getDate()})}
$("ws").textContent=fm(wk)+" · avg "+fm(el?wk/el:0)+"/day";$("bars").innerHTML=chart(it,400,200,{lab:1});
var dy=day(hd),sw=subR(w,TD),sm=subR(ms,TD),h='<span class="th"></span><span class="th">Subject</span><span class="th r">'+(+hd==+TD?"Today":"Yest.")+'</span><span class="th r">Week</span><span class="th r">Month</span>';
[0,1,2,3,4,5].filter(function(i){return i<5||sm[i]}).sort(function(x,y){return sm[y]-sm[x]}).forEach(function(i){var z=sm[i]?"":" z";h+='<span><i class="dot" style="--c:'+SUB[i][1]+'"></i></span><span class="'+z+'">'+SUB[i][0]+'</span><span class="r'+z+'">'+(dy[i]?hc(dy[i]):"–")+'</span><span class="r'+z+'">'+(sw[i]?hc(sw[i]):"–")+'</span><span class="r'+z+'" style="font-weight:600">'+(sm[i]?hc(sm[i]):"–")+'</span>'});$("tb").innerHTML=h}
</script>

<script src="data.js"></script>
</body></html>
